model:
  type: vespag
  vespag:
    hidden_sizes: [256]  # VespaG paper architecture
    dropout: 0.2  # VespaG paper dropout
    freeze_backbone: true  # Keep ESM2-3B frozen, only train FNN head
    normalize_scores: false
    load_pretrained: true  # Start from pretrained VespaG FNN weights

training:
  batch_size: 16  # Adjust based on GPU memory
  epochs: 10
  learning_rate: 0.001
  warmup_steps: 100
  save_every: 0  # Only save at end (0 = disabled)
  training_mode: per_mutation  # Use per-mutation training

data:
  start_pos: 21562  # Spike protein start
  end_pos: 25381    # Spike protein end

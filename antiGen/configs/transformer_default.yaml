# Transformer from scratch - default config
model:
  type: transformer
  transformer:
    d_model: 128
    nhead: 4
    dim_feedforward: 512
    num_layers: 1
    dropout: 0.1

training:
  batch_size: 64
  epochs: 1
  learning_rate: 0.0001
  warmup_steps: 100
  save_every: 100  # Save checkpoint every N batches (0 = only at end)
  seed: 42

data:
  start_pos: 21562
  end_pos: 25381
  dt: 0.01

output_dir: ./checkpoints
